server:
  port: ${PORT:${SERVER_PORT:8081}}
spring:
  application:
    name: traffic-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
    username: ${ORACLE_USER}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    # O Oracle da FIAP limita as sessoes simultaneas por usuario; o pool fica pequeno.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    table: flyway_travessia_history
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  ai:
    retry:
      max-attempts: 1
      on-client-errors: false
    openai:
      api-key: ${GEMINI_API_KEY:sem-chave-configurada}
      base-url: ${IA_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      chat:
        completions-path: /chat/completions
        options:
          model: gemini-3.5-flash-lite
          temperature: 0.0
  cloud:
    discovery:
      enabled: true
      client:
        service-url:
          defaultZone: ${EUREKA_URI:${SPRING_CLOUD_DISCOVERY_CLIENT_SERVICE-URL_DEFAULTZONE:http://eureka:8761/eureka/}}
servico-iot:
  url: ${SERVICO_IOT_URL:http://localhost:8083}
spring.cloud.openfeign.client.config.servico-iot:
  connect-timeout: 3000
  read-timeout: 60000
ia:
  modelos: ${GEMINI_MODELOS:gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3.1-flash-lite,gemini-3.5-flash,gemini-flash-latest,gemini-3.6-flash,gemini-3.7-flash,gemini-3-flash-preview,gemini-3.1-flash-lite-preview,gemini-3.8-flash,gemini-pro-latest,gemini-3.1-pro-preview}
weather:
  api-key: ${WEATHER_API_KEY:}
  base-url: https://api.openweathermap.org/data/2.5
